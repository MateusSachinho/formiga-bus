<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0A0D13" />
    <title>formiga-bus</title>
  </head>
  <body>
    <div id="status-bar">procurando ônibus…</div>
    <div id="brightness-control">
      <input id="brightness" type="range" min="0" max="0.25" step="0.01" aria-label="brilho do mapa" />
    </div>
    <div id="map"></div>
    <div id="search-bar">
      <input id="filter" type="search" inputmode="text" autocomplete="off" enterkeyhint="search"
        placeholder="linha, ex: 554" aria-label="filtrar por linha" />
      <button id="filter-clear" aria-label="limpar filtro" hidden>&times;</button>
    </div>
    <div id="empty-state" hidden></div>
    <div id="bus-panel" hidden>
      <button id="bus-panel-close" aria-label="fechar">&times;</button>
      <dl id="bus-panel-body"></dl>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
